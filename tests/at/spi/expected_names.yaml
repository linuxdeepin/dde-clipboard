# DDE-198 AT-SPI 锚点规则：
#   - 测试定位锚点为 setObjectName()（C++），对应 AT-SPI AccessibleId。
#   - accessible_id 字段取 setObjectName() 的值；setAccessibleName() 仅保留
#     屏幕阅读器语义，不再作为覆盖率门禁。
#   - 覆盖率口径：交互控件有 setObjectName() 即 ok。
#   - object_name 与 accessible_id 取值相同（锚点已迁至 setObjectName），
#     保留 object_name 以记录原始 setObjectName() 调用值。
